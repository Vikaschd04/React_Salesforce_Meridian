# Render blueprint — one web service that builds the SPA and runs the BFF, which
# serves dist/ + /api on a single origin. Deploy: push to a repo, "New +" →
# "Blueprint" in Render, point at this file.
#
# This deploys straight away in mock mode (leave the sync:false vars blank). To
# go live, set these in the Render dashboard (service → Environment) and redeploy:
#   PUBLIC_URL         = https://<your-service>.onrender.com   (sitemap/canonical)
#   DATA_SOURCE        = salesforce
#   SF_LOGIN_URL       = https://<your-org>.my.salesforce.com
#   SF_CLIENT_ID / SF_CLIENT_SECRET / SF_ACCOUNT_NAME
# To enable Stripe TEST-mode payments, set (test keys only — see below):
#   PAYMENT_PROVIDER   = stripe
#   STRIPE_SECRET_KEY  = sk_test_…    STRIPE_PUBLISHABLE_KEY = pk_test_…
#   STRIPE_WEBHOOK_SECRET = whsec_…   (optional; refund-on-cancel works without it)
services:
  - type: web
    name: meridian
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production (set below) otherwise makes npm skip
    # devDependencies, so vite wouldn't be installed and the build would exit 127.
    buildCommand: npm ci --include=dev && npm run build && npm --prefix server ci --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATA_SOURCE
        value: "mock"
      # Payments are dashboard-managed (sync:false) so secrets never touch git and
      # a blueprint re-sync never clobbers them. Leave PAYMENT_PROVIDER blank for
      # mock (the default); set it to "stripe" + the keys to enable Stripe.
      - key: PAYMENT_PROVIDER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
